<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تبدیل ریال به تومان و تومان به ریال</title>
    <!-- افزودن فونت پشتیبان آنلاین IRANSans -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@master/dist/IRANSansWeb.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-bar">
                <button id="theme-toggle" class="theme-btn" aria-label="تغییر حالت">
                    <span class="icon-wrapper">
                        <span class="icon-moon">
                            <!-- ماه نصفه فلت -->
                            <svg width="28" height="28" viewBox="0 0 28 28">
                                <path d="M18 14a8 8 0 1 1-8-8c0 4.42 3.58 8 8 8z" fill="#c6bba7"/>
                                <path d="M14 6a8 8 0 0 0 0 16" fill="#f1e9d2"/>
                            </svg>
                        </span>
                        <span class="icon-sun">
                            <!-- خورشید فلت و مینیمال -->
                            <svg width="28" height="28" viewBox="0 0 28 28">
                                <circle cx="14" cy="14" r="7" fill="#ffe066"/>
                                <g stroke="#ffd700" stroke-width="2">
                                    <line x1="14" y1="2" x2="14" y2="6"/>
                                    <line x1="14" y1="22" x2="14" y2="26"/>
                                    <line x1="2" y1="14" x2="6" y2="14"/>
                                    <line x1="22" y1="14" x2="26" y2="14"/>
                                </g>
                            </svg>
                        </span>
                    </span>
                </button>
                <h1 class="mini-title">تبدیل ریال به تومان و تومان به ریال آنلاین</h1>
            </div>
        </header>
        
        <div class="info-box">
            <p>برای تبدیل تومان به ریال یا تبدیل ریال به تومان بعد از انتخاب نوع تبدیل عدد مربوطه وارد کنید.</p>
        </div>
        
        <div class="form-container">
            <div class="form-group">
                <label for="conversion-type">نوع تبدیل:</label>
                <select id="conversion-type">
                    <option value="toman-to-rial">تومان به ریال</option>
                    <option value="rial-to-toman">ریال به تومان</option>
                </select>
            </div>
            
            <div class="form-group">
                <label id="amount-label">مبلغ را به تومان وارد کنید:</label>
                <input type="text" id="amount" placeholder="به طور مثال: 50000" dir="ltr">
            </div>
            
            <button id="convert-btn" class="btn primary-btn">
                <i class="material-icons btn-icon">autorenew</i> تبدیل
            </button>
        </div>
        
        <div id="result-container" class="result-container hidden">
            <div class="result-group">
                <div class="result-header">
                    <h3>نتیجه به عدد</h3>
                </div>
                <div class="result-box">
                    <span id="numeric-result" class="result-text"></span>
                </div>
                <button id="copy-numeric" class="btn secondary-btn">کپی</button>
            </div>
            
            <div class="result-group">
                <div class="result-header">
                    <h3>نتیجه به حروف</h3>
                </div>
                <div class="result-box">
                    <span id="text-result" class="result-text"></span>
                </div>
                <button id="copy-text" class="btn secondary-btn">کپی</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
    <script>
    document.fonts.ready.then(() => {
        document.body.style.opacity = '1';
    });
    </script>
</body>
</html>
